[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subepipredict"
version = "1.0.0"
description = "Python port of the SubEpiPredict MATLAB toolbox: ensemble n-sub-epidemic modeling and forecasting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gerardo Chowell" }]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["subepipredict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that fit models (deselect with -m \"not slow\")"]
